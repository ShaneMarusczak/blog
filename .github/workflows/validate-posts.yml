name: Validate site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate sources
        run: python3 tools/validate.py

      - name: Check generated files are current
        run: |
          python3 tools/build.py
          if ! git diff --quiet; then
            echo ""
            echo "Generated files are out of date with the sources."
            echo "Run 'python3 tools/build.py' and commit the result."
            echo ""
            git diff --stat
            exit 1
          fi
          echo "OK - generated files match the sources."
